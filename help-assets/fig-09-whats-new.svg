<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 540" width="1220" height="540" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .acc { fill:#5B9CF6; font-size:12px; font-weight:600; }
      .dim { fill:#8A8A8F; font-size:11px; }
      .t   { fill:#C9C9CE; font-size:12.5px; }
      .seen{ fill:#8A8A8F; font-size:12.5px; }
      .grp { fill:#6E6E73; font-size:10px; font-weight:700; letter-spacing:0.08em; }
      .pill{ font-size:8.5px; font-weight:700; letter-spacing:0.04em; }
      .lead{ stroke:#5B9CF6; stroke-width:1; fill:none; }
      .ico { stroke:#A0A0A5; stroke-width:1.3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>
  <rect width="1220" height="540" fill="#17181c"/>

  <text x="40" y="34" fill="#5B9CF6" font-size="15" font-weight="700">What's New</text>
  <text x="40" y="54" class="dim" font-size="11.5">The row above the vault tree, and the page it opens. New and Updated come from the list of pages, not from timestamps.</text>

  <!-- ── sidebar mini ─────────────────────────────────────────── -->
  <rect x="40" y="78" width="212" height="182" rx="6" fill="#1e1f24" stroke="#35363a"/>
  <text x="56" y="102" fill="#C9C9CE" font-size="11.5" font-weight="700">Vault Files</text>
  <g class="ico" transform="translate(224,93)"><polyline points="0,8 5,3 10,8"/><polyline points="0,3 5,-2 10,3"/></g>

  <!-- the pinned row -->
  <rect x="48" y="112" width="196" height="24" rx="4" fill="#5B9CF6" opacity=".10"/>
  <text x="58" y="128" class="t">What's New</text>
  <rect x="206" y="117" width="26" height="14" rx="7" fill="#5B9CF6"/>
  <text x="219" y="127.5" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">3</text>
  <line x1="40" y1="146" x2="252" y2="146" stroke="#35363a"/>

  <g class="ico" transform="translate(58,164)" stroke-width="1.2"><polyline points="0,0 4,4 0,8"/></g>
  <rect x="74" y="162" width="11" height="10" rx="2.5" fill="#FF8080" opacity=".85"/>
  <text x="95" y="171" class="t">00_Identity</text>
  <g class="ico" transform="translate(58,192)" stroke-width="1.2"><polyline points="0,0 4,4 0,8"/></g>
  <rect x="74" y="190" width="11" height="10" rx="2.5" fill="#F5C26B" opacity=".85"/>
  <text x="95" y="199" class="t">01_Projects</text>
  <g class="ico" transform="translate(58,220)" stroke-width="1.2"><polyline points="0,0 4,4 0,8"/></g>
  <rect x="74" y="218" width="11" height="10" rx="2.5" fill="#A0A0A5" opacity=".85"/>
  <text x="95" y="227" class="t">02_Admin</text>

  <!-- ── the page ─────────────────────────────────────────────── -->
  <rect x="304" y="78" width="656" height="404" rx="6" fill="#24252b" stroke="#35363a"/>
  <text x="330" y="116" fill="#5B9CF6" font-size="19" font-weight="700">What's New</text>
  <text x="330" y="138" class="dim">3 pages you haven't seen</text>

  <!-- filter bar -->
  <rect x="330" y="154" width="52" height="20" rx="4" fill="none" stroke="#5B9CF6"/>
  <text x="356" y="167.5" fill="#5B9CF6" font-size="10.5" text-anchor="middle">Unseen</text>
  <text x="400" y="167.5" class="dim" font-size="10.5">New</text>
  <text x="436" y="167.5" class="dim" font-size="10.5">Updated</text>
  <text x="492" y="167.5" class="dim" font-size="10.5">All</text>
  <rect x="536" y="154" width="58" height="20" rx="4" fill="none" stroke="#5B9CF6"/>
  <text x="565" y="167.5" fill="#5B9CF6" font-size="10.5" text-anchor="middle">30 days</text>
  <text x="606" y="167.5" class="dim" font-size="10.5">90 days</text>
  <text x="658" y="167.5" class="dim" font-size="10.5">All time</text>
  <text x="934" y="167.5" class="dim" font-size="10.5" text-anchor="end">Mark all seen</text>
  <line x1="330" y1="186" x2="934" y2="186" stroke="#3f4046"/>

  <!-- group: required reading -->
  <text x="330" y="212" class="grp">REQUIRED READING</text>
  <rect x="464" y="202" width="20" height="13" rx="6.5" fill="#2c2d33"/>
  <text x="474" y="211.5" fill="#8A8A8F" font-size="9" text-anchor="middle">1</text>

  <circle cx="337" cy="238" r="3.5" fill="#5B9CF6"/>
  <text x="352" y="242" class="t">Site Safety Policy</text>
  <rect x="700" y="231" width="64" height="14" rx="7" fill="rgba(251,146,60,0.12)" stroke="#fb923c"/>
  <text x="732" y="241" class="pill" fill="#fb923c" text-anchor="middle">MUST READ</text>
  <rect x="772" y="231" width="54" height="14" rx="7" fill="rgba(168,162,158,0.12)" stroke="#a8a29e"/>
  <text x="799" y="241" class="pill" fill="#a8a29e" text-anchor="middle">UPDATED</text>
  <text x="934" y="242" class="dim" font-size="10.5" text-anchor="end">2 days ago</text>

  <!-- group: this week -->
  <text x="330" y="288" class="grp">THIS WEEK</text>
  <rect x="408" y="278" width="20" height="13" rx="6.5" fill="#2c2d33"/>
  <text x="418" y="287.5" fill="#8A8A8F" font-size="9" text-anchor="middle">2</text>

  <circle cx="337" cy="314" r="3.5" fill="#5B9CF6"/>
  <text x="352" y="318" class="t">Submittal Process</text>
  <rect x="786" y="307" width="40" height="14" rx="7" fill="rgba(74,222,128,0.12)" stroke="#4ade80"/>
  <text x="806" y="317" class="pill" fill="#4ade80" text-anchor="middle">NEW</text>
  <text x="934" y="318" class="dim" font-size="10.5" text-anchor="end">yesterday</text>

  <circle cx="337" cy="346" r="3.5" fill="#5B9CF6"/>
  <text x="352" y="350" class="t">Drawing Register</text>
  <rect x="772" y="339" width="54" height="14" rx="7" fill="rgba(168,162,158,0.12)" stroke="#a8a29e"/>
  <text x="799" y="349" class="pill" fill="#a8a29e" text-anchor="middle">UPDATED</text>
  <text x="934" y="350" class="dim" font-size="10.5" text-anchor="end">3 days ago</text>

  <!-- group: earlier, already seen -->
  <text x="330" y="396" class="grp">EARLIER THIS MONTH</text>
  <rect x="476" y="386" width="20" height="13" rx="6.5" fill="#2c2d33"/>
  <text x="486" y="395.5" fill="#8A8A8F" font-size="9" text-anchor="middle">1</text>

  <text x="352" y="426" class="seen">Close-out Checklist</text>
  <rect x="772" y="415" width="54" height="14" rx="7" fill="rgba(168,162,158,0.12)" stroke="#a8a29e"/>
  <text x="799" y="425" class="pill" fill="#a8a29e" text-anchor="middle">UPDATED</text>
  <text x="934" y="426" class="dim" font-size="10.5" text-anchor="end">18 Jul</text>

  <!-- ── callouts ─────────────────────────────────────────────── -->
  <g class="lead">
    <path d="M244 124 L272 124 L272 288 L242 288"/>
    <path d="M337 250 L337 268 L292 268 L292 372 L232 372"/>
    <path d="M732 252 L732 268 L976 268"/>
    <path d="M337 426 L318 426 L318 468 L252 468"/>
    <path d="M934 178 L948 178 L948 122 L976 122"/>
  </g>

  <text x="40" y="292" class="acc">The count is what's unseen</text>
  <text x="40" y="308" class="dim">It vanishes when you are up to</text>
  <text x="40" y="322" class="dim">date, rather than sitting at zero.</text>

  <text x="40" y="376" class="acc">A dot means unseen</text>
  <text x="40" y="392" class="dim">Seen rows keep their place and</text>
  <text x="40" y="406" class="dim">fade back. Nothing is hidden,</text>
  <text x="40" y="420" class="dim">it just stops competing.</text>

  <text x="40" y="472" class="acc">Seen commits when you leave</text>
  <text x="40" y="488" class="dim">Not when you open it, so the</text>
  <text x="40" y="502" class="dim">highlight is still there when</text>
  <text x="40" y="516" class="dim">you come back to the list.</text>

  <text x="976" y="118" class="acc">Filter, and a time window</text>
  <text x="976" y="134" class="dim">Both are remembered.</text>

  <text x="976" y="264" class="acc">Required reading</text>
  <text x="976" y="280" class="dim">Skipped by Mark all</text>
  <text x="976" y="294" class="dim">seen, which tells you</text>
  <text x="976" y="308" class="dim">what it skipped.</text>

  <text x="304" y="516" class="dim">Green is New, grey is Updated, orange is required. Red is never used here — it stays reserved for comments,</text>
  <text x="304" y="530" class="dim">because a new page is not an alert.</text>
</svg>
