<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 348" width="1000" height="348" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .acc { fill:#5B9CF6; font-size:12px; font-weight:600; }
      .dim { fill:#8A8A8F; font-size:11px; }
      .lead{ stroke:#5B9CF6; stroke-width:1; fill:none; }
      .ico { stroke:#C9C9CE; stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>
  <rect width="1000" height="348" fill="#17181c"/>

  <text x="40" y="34" fill="#5B9CF6" font-size="15" font-weight="700">The header bar</text>
  <text x="40" y="54" class="dim" font-size="11.5">Seven controls, and two of them are not always there.</text>

  <!-- header strip -->
  <rect x="40" y="76" width="920" height="46" rx="6" fill="#27282c" stroke="#35363a"/>

  <!-- + new -->
  <g class="ico" transform="translate(64,91)"><line x1="8" y1="1" x2="8" y2="15"/><line x1="1" y1="8" x2="15" y2="8"/></g>
  <!-- move -->
  <g class="ico" transform="translate(104,92)"><path d="M1 3.5A2 2 0 0 1 3 1.5h4L9 3.5h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2Z"/><line x1="6" y1="9.5" x2="12" y2="9.5"/><polyline points="10,7.5 12,9.5 10,11.5"/></g>
  <!-- title -->
  <text x="152" y="105" fill="#C9C9CE" font-size="14" font-weight="600">WikiBase</text>
  <text x="228" y="105" fill="#6E6E73" font-size="13">— Team Wiki</text>

  <!-- sun -->
  <g class="ico" transform="translate(742,92)"><circle cx="8" cy="8" r="3.6"/><path d="M8 1v2M8 13v2M2.4 2.4l1.4 1.4M12.2 12.2l1.4 1.4M1 8h2M13 8h2M2.4 13.6l1.4-1.4M12.2 3.8l1.4-1.4"/></g>
  <!-- update arrow -->
  <g class="ico" transform="translate(790,92)" stroke="#5B9CF6"><path d="M8 15V2"/><path d="M2 8l6-6 6 6"/></g>
  <!-- help -->
  <g class="ico" transform="translate(838,92)"><circle cx="8" cy="8" r="7"/><path d="M5.6 5.9a2.4 2.4 0 0 1 4.6.8c0 1.6-2.4 2.3-2.4 2.3"/><line x1="8" y1="12" x2="8.01" y2="12" stroke-width="2.2"/></g>
  <!-- badge -->
  <circle cx="908" cy="99" r="13" fill="#5B9CF6" fill-opacity="0.18" stroke="#5B9CF6"/>
  <text x="908" y="104" text-anchor="middle" fill="#5B9CF6" font-size="12" font-weight="700">JS</text>

  <!-- leaders down -->
  <g class="lead">
    <path d="M72 128 L72 146 L96 146"/>
    <path d="M112 128 L112 168 L96 168"/>
    <path d="M750 128 L750 190 L500 190"/>
    <path d="M798 128 L798 212 L500 212"/>
    <path d="M846 128 L846 250 L500 250"/>
    <path d="M908 128 L908 274 L500 274"/>
  </g>
  <text x="102" y="150" class="acc">New file or folder, at the vault root</text>
  <text x="102" y="172" class="acc">Move a file to another folder</text>
  <text x="352" y="132" class="dim" font-size="10.5" text-anchor="end">both need editing turned on</text>

  <text x="494" y="194" class="acc" text-anchor="end">Flip Dark ↔ Light, no menu</text>
  <text x="494" y="216" class="acc" text-anchor="end">Update ready — click to reload</text>
  <text x="494" y="230" class="dim" font-size="10.5" text-anchor="end">only appears when there is a new version</text>
  <text x="494" y="254" class="acc" text-anchor="end">Help — this page</text>
  <text x="494" y="278" class="acc" text-anchor="end">You: Theme · Settings · Switch user</text>

  <text x="40" y="322" class="dim" font-size="11">No gear, no panel-toggle buttons. Settings moved into your initials menu; the panel toggles moved onto the panel edges.</text>
</svg>
