<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="-apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .acc { fill:#5B9CF6; font-size:12px; font-weight:600; }
      .dim { fill:#8A8A8F; font-size:11px; }
      .lead{ stroke:#5B9CF6; stroke-width:1; fill:none; }
      .ico { stroke:#C9C9CE; stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>
  <rect width="1000" height="430" fill="#17181c"/>

  <text x="40" y="34" fill="#5B9CF6" font-size="15" font-weight="700">The header bar</text>
  <text x="40" y="54" class="dim" font-size="11.5">Eight controls, and two of them are not always there.</text>

  <!-- header strip -->
  <rect x="40" y="76" width="920" height="46" rx="6" fill="#27282c" stroke="#35363a"/>

  <!-- Vault Files toggle -->
  <g class="ico" transform="translate(60,91)"><rect x="1" y="1" width="14" height="14" rx="2"/><line x1="6" y1="1" x2="6" y2="15"/></g>

  <!-- wordmark -->
  <text x="90" y="105" fill="#C9C9CE" font-size="14" font-weight="600">Folio</text>
  <text x="140" y="105" fill="#6E6E73" font-size="12">Team Wiki</text>

  <!-- Home pill, accent-filled (the one accent control in the app) -->
  <rect x="212" y="87" width="72" height="24" rx="12" fill="#5B9CF6"/>
  <g class="ico" stroke="#17181c" transform="translate(222,93)"><path d="M1 6l6-5 6 5v7a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1Z"/><path d="M4.5 14V8h4v6"/></g>
  <text x="246" y="103" fill="#17181c" font-size="12" font-weight="700">Home</text>

  <!-- Search box -->
  <rect x="300" y="87" width="340" height="24" rx="12" fill="#1c1d21" stroke="#35363a"/>
  <g class="ico" transform="translate(312,93)"><circle cx="6" cy="6" r="4.5"/><line x1="9.2" y1="9.2" x2="13" y2="13"/></g>
  <text x="330" y="103" class="dim" font-size="12">Search, saved, recent…</text>
  <rect x="590" y="91" width="38" height="16" rx="4" fill="#2c2d31" stroke="#3c3d42"/>
  <text x="609" y="102.5" fill="#8A8A8F" font-size="9.5" text-anchor="middle">Ctrl K</text>

  <!-- install (only shown when Folio is not yet installed) -->
  <g class="ico" stroke="#5B5C61" stroke-dasharray="2,2" transform="translate(694,92)"><path d="M8 1v9"/><path d="M3.5 6.5L8 11l4.5-4.5"/><path d="M2 14h12"/></g>

  <!-- theme sun/moon -->
  <g class="ico" transform="translate(742,92)"><circle cx="8" cy="8" r="3.6"/><path d="M8 1v2M8 13v2M2.4 2.4l1.4 1.4M12.2 12.2l1.4 1.4M1 8h2M13 8h2M2.4 13.6l1.4-1.4M12.2 3.8l1.4-1.4"/></g>

  <!-- update arrow (only shown when a newer version is ready) -->
  <g class="ico" transform="translate(790,92)" stroke="#5B9CF6" stroke-dasharray="2,2"><path d="M8 15V2"/><path d="M2 8l6-6 6 6"/></g>

  <!-- help -->
  <g class="ico" transform="translate(838,92)"><circle cx="8" cy="8" r="7"/><path d="M5.6 5.9a2.4 2.4 0 0 1 4.6.8c0 1.6-2.4 2.3-2.4 2.3"/><line x1="8" y1="12" x2="8.01" y2="12" stroke-width="2.2"/></g>

  <!-- account badge -->
  <circle cx="905" cy="99" r="13" fill="#5B9CF6" fill-opacity="0.18" stroke="#5B9CF6"/>
  <text x="905" y="104" text-anchor="middle" fill="#5B9CF6" font-size="12" font-weight="700">JS</text>

  <!-- leaders down: each elbow sits well clear of the text row it points to -->
  <g class="lead">
    <path d="M67 128 L67 138 L110 138"/>
    <path d="M246 128 L246 160 L110 160"/>
    <path d="M470 128 L470 186 L110 186"/>
    <path d="M609 128 L609 210 L110 210"/>
    <path d="M702 128 L702 238 L500 238"/>
    <path d="M750 128 L750 276 L500 276"/>
    <path d="M798 128 L798 300 L500 300"/>
    <path d="M846 128 L846 338 L500 338"/>
    <path d="M905 128 L905 362 L500 362"/>
  </g>

  <text x="120" y="148" class="acc">Show or hide Vault Files</text>
  <text x="120" y="170" class="acc">Home — the front door</text>
  <text x="120" y="196" class="acc">Quick search — same box as Ctrl K / ⌘K</text>
  <text x="120" y="220" class="dim" font-size="10.5">the shortcut hint sits inside the box itself</text>

  <text x="494" y="248" class="acc" text-anchor="end">Install Folio</text>
  <text x="494" y="262" class="dim" font-size="10.5" text-anchor="end">only shown before it's installed</text>
  <text x="494" y="286" class="acc" text-anchor="end">Flip Dark ↔ Light, no menu</text>
  <text x="494" y="310" class="acc" text-anchor="end">Update ready — click to reload</text>
  <text x="494" y="324" class="dim" font-size="10.5" text-anchor="end">only shown when a newer version is waiting</text>
  <text x="494" y="348" class="acc" text-anchor="end">Help — this page</text>
  <text x="494" y="372" class="acc" text-anchor="end">You: Theme · Settings · Switch user · Usage</text>

  <text x="40" y="410" class="dim" font-size="11">No gear icon in the header. Settings lives in the initials menu; Vault Files toggles from its own icon, far left.</text>
</svg>
