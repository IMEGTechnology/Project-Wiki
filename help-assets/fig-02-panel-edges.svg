<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .cap { fill:#C9C9CE; font-size:13px; font-weight:600; }
      .sub { fill:#8A8A8F; font-size:11.5px; }
      .acc { fill:#5B9CF6; font-size:11.5px; font-weight:600; }
      .lead { stroke:#5B9CF6; stroke-width:1; fill:none; }
    </style>
  </defs>
  <rect width="1000" height="340" fill="#17181c"/>

  <text x="40" y="34" fill="#5B9CF6" font-size="15" font-weight="700">The tab on a panel edge</text>
  <text x="40" y="54" class="sub">Every panel edge is a drag line with a small tab bulging out of it near the top. Four things you can do with it.</text>

  <!-- 1: open, hover -->
  <g transform="translate(40,84)">
    <rect x="0" y="0" width="180" height="200" rx="6" fill="#1e1f24" stroke="#35363a"/>
    <rect x="176" y="0" width="4" height="200" fill="#35363a"/>
    <path d="M176,60 L176,20 Q176,14 182,14 L194,14 Q200,14 200,20 L200,42 C200,56 184,56 180,68 Z" fill="#2f3036" stroke="#4a4b50"/>
    <rect x="183" y="22" width="3.2" height="9.6" fill="#C9C9CE"/>
    <rect x="183" y="22" width="9.6" height="9.6" rx="1" fill="none" stroke="#C9C9CE" stroke-width="1.05"/>
    <rect x="14" y="20" width="10" height="9" rx="2" fill="#FF8080" opacity=".8"/><rect x="34" y="21" width="70" height="7" rx="3" fill="#3a3b40"/>
    <rect x="14" y="42" width="10" height="9" rx="2" fill="#F5C26B" opacity=".8"/><rect x="34" y="43" width="86" height="7" rx="3" fill="#3a3b40"/>
    <rect x="26" y="64" width="10" height="9" rx="2" fill="#5FD98A" opacity=".8"/><rect x="46" y="65" width="60" height="7" rx="3" fill="#3a3b40"/>
    <rect x="14" y="86" width="10" height="9" rx="2" fill="#5B9CF6" opacity=".8"/><rect x="34" y="87" width="76" height="7" rx="3" fill="#3a3b40"/>
    <text x="0" y="228" class="cap">1 · Click the tab</text>
    <text x="0" y="248" class="sub">Collapses or reopens the panel.</text>
    <text x="0" y="264" class="sub">Fastest way in and out.</text>
  </g>

  <!-- 2: drag -->
  <g transform="translate(280,84)">
    <rect x="0" y="0" width="180" height="200" rx="6" fill="#1e1f24" stroke="#35363a"/>
    <rect x="176" y="0" width="4" height="200" fill="#5B9CF6"/>
    <path d="M176,60 L176,20 Q176,14 182,14 L194,14 Q200,14 200,20 L200,42 C200,56 184,56 180,68 Z" fill="#2f3036" stroke="#4a4b50"/>
    <rect x="183" y="22" width="3.2" height="9.6" fill="#C9C9CE"/>
    <rect x="183" y="22" width="9.6" height="9.6" rx="1" fill="none" stroke="#C9C9CE" stroke-width="1.05"/>
    <g stroke="#5B9CF6" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M150 110 h-22 M132 104 l-6 6 6 6"/>
      <path d="M206 110 h22 M224 104 l6 6 -6 6"/>
    </g>
    <rect x="14" y="20" width="10" height="9" rx="2" fill="#FF8080" opacity=".8"/><rect x="34" y="21" width="70" height="7" rx="3" fill="#3a3b40"/>
    <rect x="14" y="42" width="10" height="9" rx="2" fill="#F5C26B" opacity=".8"/><rect x="34" y="43" width="86" height="7" rx="3" fill="#3a3b40"/>
    <text x="0" y="228" class="cap">2 · Drag the line</text>
    <text x="0" y="248" class="sub">Resizes the panel. Your width</text>
    <text x="0" y="264" class="sub">is saved for next time.</text>
  </g>

  <!-- 3: double click -->
  <g transform="translate(520,84)">
    <rect x="0" y="0" width="180" height="200" rx="6" fill="#1e1f24" stroke="#35363a"/>
    <rect x="176" y="0" width="4" height="200" fill="#35363a"/>
    <path d="M176,60 L176,20 Q176,14 182,14 L194,14 Q200,14 200,20 L200,42 C200,56 184,56 180,68 Z" fill="#2f3036" stroke="#4a4b50"/>
    <rect x="183" y="22" width="3.2" height="9.6" fill="#C9C9CE"/>
    <rect x="183" y="22" width="9.6" height="9.6" rx="1" fill="none" stroke="#C9C9CE" stroke-width="1.05"/>
    <circle cx="178" cy="118" r="9" fill="none" stroke="#5B9CF6" stroke-width="1.2"/>
    <circle cx="178" cy="118" r="14" fill="none" stroke="#5B9CF6" stroke-width="1" opacity=".45"/>
    <text x="196" y="122" class="acc">×2</text>
    <rect x="14" y="20" width="10" height="9" rx="2" fill="#FF8080" opacity=".8"/><rect x="34" y="21" width="70" height="7" rx="3" fill="#3a3b40"/>
    <rect x="14" y="42" width="10" height="9" rx="2" fill="#F5C26B" opacity=".8"/><rect x="34" y="43" width="86" height="7" rx="3" fill="#3a3b40"/>
    <text x="0" y="228" class="cap">3 · Double-click the line</text>
    <text x="0" y="248" class="sub">Also collapses. Two clicks, so a</text>
    <text x="0" y="264" class="sub">stray click while aiming to drag</text>
    <text x="0" y="280" class="sub">does not shut the panel.</text>
  </g>

  <!-- 4: collapsed -->
  <g transform="translate(760,84)">
    <rect x="0" y="0" width="180" height="200" rx="6" fill="#24252b" stroke="#35363a"/>
    <rect x="0" y="0" width="4" height="200" fill="#35363a"/>
    <path d="M0,60 L0,20 Q0,14 6,14 L18,14 Q24,14 24,20 L24,42 C24,56 8,56 4,68 Z" fill="#3a3b42" stroke="#5a5b62"/>
    <rect x="7" y="22" width="3.2" height="9.6" fill="#FFFFFF"/>
    <rect x="7" y="22" width="9.6" height="9.6" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1.05"/>
    <text x="46" y="112" fill="#5B9CF6" font-size="17" font-weight="700">Site A — Scope</text>
    <rect x="46" y="126" width="110" height="6" rx="3" fill="#3a3b40"/>
    <rect x="46" y="142" width="120" height="6" rx="3" fill="#3a3b40"/>
    <rect x="46" y="158" width="88" height="6" rx="3" fill="#3a3b40"/>
    <text x="0" y="228" class="cap">4 · While collapsed</text>
    <text x="0" y="248" class="sub">The tab stays lit permanently</text>
    <text x="0" y="264" class="sub">so you can find it. Click to</text>
    <text x="0" y="280" class="sub">bring the panel back.</text>
  </g>

  <text x="40" y="318" class="sub">The tab's icon shades the side it belongs to — the left one shades its left edge, the right one its right edge — so it is clear which panel you are about to open.</text>
</svg>
