<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" width="1000" height="492" font-family="-apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .acc  { fill:#5B9CF6; font-size:12.5px; font-weight:700; }
      .dim  { fill:#8A8A8F; font-size:11.5px; }
      .item { fill:#C9C9CE; font-size:11.5px; }
      .ico  { stroke:#C9C9CE; stroke-width:1.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>
  <rect width="1000" height="492" fill="#17181c"/>

  <text x="40" y="34" fill="#5B9CF6" font-size="15" font-weight="700">Companions and destinations</text>
  <text x="40" y="54" class="dim">Everything besides the page you are reading is one of two things, and that is what decides where it opens.</text>

  <!-- ════════ COMPANION ════════ -->
  <rect x="40" y="76" width="440" height="300" rx="7" fill="#1c1d21" stroke="#35363a"/>
  <text x="64" y="104" class="acc">A COMPANION shares the screen</text>
  <text x="64" y="124" class="dim">It describes the page beside it, so it opens in the</text>
  <text x="64" y="140" class="dim">right column and leaves when that page does.</text>

  <!-- mock: right column lit -->
  <rect x="64" y="158" width="392" height="120" rx="5" fill="#17181c" stroke="#35363a"/>
  <rect x="64" y="158" width="392" height="20" rx="5" fill="#27282c"/>
  <rect x="64" y="178" width="76" height="100" fill="#1a1b1f"/>
  <rect x="70" y="190" width="52" height="5" rx="2.5" fill="#2c2d32"/>
  <rect x="70" y="204" width="60" height="5" rx="2.5" fill="#2c2d32"/>
  <rect x="70" y="218" width="44" height="5" rx="2.5" fill="#2c2d32"/>
  <rect x="158" y="192" width="150" height="7" rx="3.5" fill="#33343a"/>
  <rect x="158" y="212" width="186" height="5" rx="2.5" fill="#2c2d32"/>
  <rect x="158" y="226" width="164" height="5" rx="2.5" fill="#2c2d32"/>
  <rect x="158" y="246" width="176" height="5" rx="2.5" fill="#2c2d32"/>
  <rect x="366" y="178" width="90" height="100" fill="#20293a" stroke="#3d5a86"/>
  <rect x="374" y="190" width="52" height="5" rx="2.5" fill="#5B9CF6"/>
  <rect x="374" y="204" width="66" height="5" rx="2.5" fill="#3d5a86"/>
  <rect x="374" y="218" width="58" height="5" rx="2.5" fill="#3d5a86"/>
  <rect x="374" y="232" width="62" height="5" rx="2.5" fill="#3d5a86"/>

  <text x="64" y="308" class="item" font-weight="600">Outline</text>
  <text x="64" y="328" class="dim">always there, on every page</text>
  <text x="238" y="308" class="item" font-weight="600">Comments · Links · Changes</text>
  <text x="238" y="328" class="dim">summoned from the page's own controls</text>
  <line x1="64" y1="344" x2="456" y2="344" stroke="#2c2d32"/>
  <text x="64" y="364" class="dim">Closed by the same control that opened it.</text>

  <!-- ════════ DESTINATION ════════ -->
  <rect x="520" y="76" width="440" height="300" rx="7" fill="#1c1d21" stroke="#35363a"/>
  <text x="544" y="104" class="acc">A DESTINATION takes the middle</text>
  <text x="544" y="124" class="dim">It is not about any one page, so it is a place you</text>
  <text x="544" y="140" class="dim">go rather than something shown alongside.</text>

  <!-- mock: middle lit, right column gone -->
  <rect x="544" y="158" width="392" height="120" rx="5" fill="#17181c" stroke="#35363a"/>
  <rect x="544" y="158" width="392" height="20" rx="5" fill="#27282c"/>
  <rect x="544" y="178" width="76" height="100" fill="#1a1b1f"/>
  <rect x="550" y="190" width="52" height="5" rx="2.5" fill="#2c2d32"/>
  <rect x="550" y="204" width="60" height="5" rx="2.5" fill="#2c2d32"/>
  <rect x="550" y="218" width="44" height="5" rx="2.5" fill="#2c2d32"/>
  <rect x="620" y="178" width="316" height="100" fill="#20293a" stroke="#3d5a86"/>
  <rect x="636" y="192" width="120" height="7" rx="3.5" fill="#5B9CF6"/>
  <rect x="636" y="214" width="280" height="5" rx="2.5" fill="#3d5a86"/>
  <rect x="636" y="230" width="252" height="5" rx="2.5" fill="#3d5a86"/>
  <rect x="636" y="246" width="268" height="5" rx="2.5" fill="#3d5a86"/>
  <rect x="636" y="262" width="214" height="5" rx="2.5" fill="#3d5a86"/>

  <text x="544" y="308" class="item" font-weight="600">Search results · Saved · What's New · Admin</text>
  <text x="544" y="328" class="dim">Reached from Home, the header, or the search box</text>
  <line x1="544" y1="344" x2="936" y2="344" stroke="#2c2d32"/>
  <text x="544" y="364" class="dim">Close, in its corner, returns you to what you were reading.</text>

  <!-- ════════ the tab strip rule ════════ -->
  <rect x="40" y="396" width="920" height="72" rx="6" fill="#1c1d21" stroke="#35363a"/>
  <g transform="translate(62,412)">
    <rect x="0" y="0" width="52" height="17" rx="4" fill="#26364d" stroke="#3d5a86"/>
    <text x="12" y="12" fill="#5B9CF6" font-size="10" font-weight="600">Outline</text>
    <rect x="58" y="0" width="66" height="17" rx="4" fill="#1c1d21" stroke="#35363a"/>
    <text x="68" y="12" fill="#8A8A8F" font-size="10">Comments</text>
  </g>
  <text x="204" y="420" fill="#C9C9CE" font-size="12" font-weight="600">Two companions at once</text>
  <text x="204" y="438" class="dim">Open a second one and this strip of tabs appears above the column, so you can switch between them.</text>
  <text x="204" y="456" class="dim">With only the Outline open there is no strip at all, which is deliberate rather than missing.</text>
</svg>
