      .dim { fill:#6E6E73; font-size:11px; }
      .lead { stroke:#5B9CF6; stroke-width:1; fill:none; }
      .ico { stroke:#A0A0A5; stroke-width:1.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect x="-150" y="0" width="1215" height="580" fill="#17181c"/>

  <!-- app frame -->
  <rect x="40" y="70" width="800" height="420" rx="8" fill="#17181c" stroke="#35363a"/>

  <!-- header -->
  <rect x="40" y="70" width="800" height="34" rx="8" fill="#27282c"/>
  <rect x="40" y="94" width="800" height="10" fill="#27282c"/>
  <line x1="40" y1="104" x2="840" y2="104" stroke="#35363a"/>
  <!-- header icons -->
  <g class="ico" transform="translate(56,80)"><line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/></g>
  <g class="ico" transform="translate(80,80)"><path d="M1 3.5a1.5 1.5 0 0 1 1.5-1.5h3l1.5 1.5h6a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5H2.5A1.5 1.5 0 0 1 1 10Z"/></g>
  <text x="112" y="91" class="txt" font-weight="600">WikiBase</text>
