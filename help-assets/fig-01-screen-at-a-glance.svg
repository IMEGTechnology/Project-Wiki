  <rect x="648" y="104" width="192" height="386" fill="#1e1f24"/>
  <g class="ico" transform="translate(662,118)" stroke-width="1.3"><line x1="4" y1="0" x2="12" y2="0"/><line x1="4" y1="4" x2="12" y2="4"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="0" y1="0" x2="0.5" y2="0"/><line x1="0" y1="4" x2="0.5" y2="4"/><line x1="0" y1="8" x2="0.5" y2="8"/></g>
  <rect x="658" y="134" width="20" height="2" fill="#5B9CF6"/>
  <g class="ico" transform="translate(692,117)" stroke-width="1.3"><path d="M10 12l-5-3.5L0 12V1a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1z"/></g>
  <g class="ico" transform="translate(722,118)" stroke-width="1.3"><path d="M12 8a1 1 0 0 1-1 1H4l-3 3V1a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1z"/></g>
  <g class="ico" transform="translate(752,119)" stroke-width="1.3"><path d="M4 6a3 3 0 0 0 4.5.3l1.8-1.8A3 3 0 0 0 6 .3L5 1.3"/><path d="M6 4.5A3 3 0 0 0 1.5 4.2L-0.3 6A3 3 0 0 0 4 10.3L5 9.3"/></g>
  <g class="ico" transform="translate(782,118)" stroke-width="1.3"><circle cx="5" cy="5" r="4.5"/><line x1="11" y1="11" x2="8.5" y2="8.5"/></g>

  <text x="662" y="160" class="txt" font-weight="700" font-size="11">Outline</text>
  <line x1="656" y1="170" x2="832" y2="170" stroke="#35363a"/>
  <rect x="652" y="178" width="184" height="20" fill="#5B9CF6" opacity="0.10"/>
  <rect x="834" y="178" width="2" height="20" fill="#5B9CF6"/>
  <text x="676" y="192" fill="#5B9CF6" font-size="11.5">Site A — Scope</text>
  <text x="690" y="214" class="lbl" font-size="11.5">Deliverables</text>
  <text x="690" y="236" class="lbl" font-size="11.5">Programme</text>
  <text x="704" y="258" class="lbl" font-size="11.5">Milestones</text>
  <text x="690" y="280" class="lbl" font-size="11.5">Risks</text>
  <g class="ico" transform="translate(816,184)" stroke-width="1.2" stroke="#5B9CF6"><path d="M8 10l-4-2.8L0 10V1a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1z"/></g>
  <text x="662" y="474" class="dim" font-size="10">Version 0.23.0</text>

  <!-- callouts -->
  <g class="lead">
    <path d="M60 66 L60 44 L150 44"/>
    <path d="M769 66 L769 40 L700 40"/>
    <path d="M120 300 L30 300"/>
    <path d="M420 505 L420 520"/>
    <path d="M744 300 L880 300"/>
    <path d="M208 165 L208 562 L300 562"/>
