  <text x="94" y="504" fill="#C9C9CE" font-size="12" font-weight="600">Setting a column's width</text>
  <text x="94" y="522" class="dim">Drag either inner edge to resize. Double-click it to fit the column to its content. Your widths are remembered on this computer.</text>
