  <text x="252" y="184" fill="#5B9CF6" font-size="19" font-weight="700">Site A — Scope</text>
  <rect x="252" y="200" width="344" height="1.5" fill="#5B9CF6" opacity="0.25"/>
  <text x="252" y="228" class="txt" font-size="12.5">Body text of the note renders here, in a column</text>
  <text x="252" y="248" class="txt" font-size="12.5">with its own left and right margins. The corner</text>
  <text x="252" y="268" class="txt" font-size="12.5">controls line up with that same text edge.</text>
  <text x="252" y="304" fill="#FF8080" font-size="15" font-weight="700">Deliverables</text>
  <text x="252" y="330" class="txt" font-size="12.5">• Survey and site plan</text>
  <text x="252" y="350" class="txt" font-size="12.5">• Permit set</text>
  <text x="252" y="370" class="txt" font-size="12.5">• Close-out package</text>
  <rect x="252" y="392" width="344" height="46" rx="5" fill="#5B9CF6" opacity="0.08"/>
  <rect x="252" y="392" width="2.5" height="46" fill="#5B9CF6"/>
  <text x="266" y="410" fill="#5B9CF6" font-size="11" font-weight="700">📝 Note</text>
  <text x="266" y="428" class="txt" font-size="11.5">Callouts render in theme-matched colours.</text>

