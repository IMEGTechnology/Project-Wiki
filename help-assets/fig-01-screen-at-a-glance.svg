  <text x="156" y="48" class="cal">New file · Move file</text>
  <text x="694" y="44" class="cal" text-anchor="end">Dark/Light · Help · You</text>
  <text x="24" y="292" class="cal" text-anchor="end">Sidebar</text>
  <text x="24" y="310" class="lbl" text-anchor="end">your folder tree</text>
  <text x="420" y="537" class="cal" text-anchor="middle">Reader — the note you are on</text>
  <text x="886" y="292" class="cal">Right panel</text>
  <text x="886" y="310" class="lbl">Outline, Bookmarks,</text>
  <text x="886" y="326" class="lbl">Comments, Links, Search</text>
  <text x="306" y="566" class="cal">Click the tab to collapse a panel, drag the line to resize</text>
</svg>
