  <text x="54" y="140" fill="#8A8A8F" font-size="10.5">What's New</text>
  <rect x="166" y="131" width="22" height="12" rx="6" fill="#5B9CF6"/>
  <text x="177" y="140" fill="#ffffff" font-size="8.5" font-weight="700" text-anchor="middle">3</text>

  <g transform="translate(0,22)">
    <rect x="48" y="140" width="10" height="9" rx="2" fill="#FF8080" opacity="0.85"/>
    <text x="66" y="149" class="txt">00_Identity</text>
    <rect x="48" y="162" width="10" height="9" rx="2" fill="#F5C26B" opacity="0.85"/>
    <text x="66" y="171" class="txt">01_Projects</text>
    <rect x="60" y="184" width="10" height="9" rx="2" fill="#5FD98A" opacity="0.85"/>
    <text x="78" y="193" class="txt">Site A</text>
    <rect x="72" y="206" width="8" height="9" rx="1.5" fill="none" stroke="#6E6E73"/>
    <text x="88" y="215" class="txt" fill="#8A8A8F">Notes.md</text>
    <rect x="60" y="228" width="10" height="9" rx="2" fill="#5B9CF6" opacity="0.85"/>
    <text x="78" y="237" class="txt">Site B</text>
    <rect x="48" y="250" width="10" height="9" rx="2" fill="#A0A0A5" opacity="0.85"/>
    <text x="66" y="259" class="txt">02_Admin</text>
