  <g class="ico" transform="translate(232,124)" stroke-width="1.2"><path d="M10 4H2"/><path d="M6 8L2 4l4-4"/></g>
  <g class="ico" transform="translate(254,124)" stroke-width="1.2"><path d="M2 4h8"/><path d="M6 0l4 4-4 4"/></g>
  <line x1="274" y1="120" x2="274" y2="132" stroke="#35363a"/>
  <text x="284" y="132" class="dim">site-a-scope.md</text>
  <g class="ico" transform="translate(600,122)" stroke-width="1.2"><line x1="0" y1="10" x2="0" y2="6"/><line x1="0" y1="4" x2="0" y2="0"/><line x1="5" y1="10" x2="5" y2="5"/><line x1="5" y1="3" x2="5" y2="0"/><line x1="10" y1="10" x2="10" y2="7"/><line x1="10" y1="5" x2="10" y2="0"/><line x1="-2" y1="6" x2="2" y2="6"/><line x1="3" y1="3" x2="7" y2="3"/><line x1="8" y1="7" x2="12" y2="7"/></g>
  <g class="ico" transform="translate(622,122)" stroke-width="1.2"><path d="M8 0a1.4 1.4 0 1 1 2 2L3.2 8.8 0 10l1-3Z"/></g>

