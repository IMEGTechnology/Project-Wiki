  <g class="ico" transform="translate(700,80)"><circle cx="7" cy="7" r="3"/><path d="M7 1v1.5M7 11.5V13M2 2l1 1M11 11l1 1M1 7h1.5M11.5 7H13M2 12l1-1M11 3l1-1"/></g>
  <g class="ico" transform="translate(730,80)"><circle cx="7" cy="7" r="6"/><path d="M5 5.5a2 2 0 0 1 3.9.6c0 1.3-2 1.9-2 1.9"/><line x1="7" y1="11" x2="7.01" y2="11" stroke-width="2"/></g>
  <circle cx="769" cy="87" r="9" fill="#5B9CF6" opacity="0.18" stroke="#5B9CF6"/>
  <text x="769" y="91" text-anchor="middle" fill="#5B9CF6" font-size="9" font-weight="700">JS</text>

