  <text x="40" y="404" class="acc">Vault Files</text>
  <text x="40" y="424" class="dim">The folder tree. Show or hide it with</text>
  <text x="40" y="440" class="dim">the icon at the far left of the header.</text>
  <text x="40" y="456" class="dim">Folders you open stay open next time.</text>

  <text x="358" y="404" class="acc">The reader</text>
  <text x="358" y="424" class="dim">The note you are on. Its controls sit in</text>
  <text x="358" y="440" class="dim">the two top corners, lined up with the</text>
  <text x="358" y="456" class="dim">text rather than the panel edge.</text>

  <text x="676" y="404" class="acc">Companions</text>
  <text x="676" y="424" class="dim">Outline is always here. Comments and</text>
  <text x="676" y="440" class="dim">Links join it when you ask for them.</text>
  <text x="676" y="456" class="dim">The column comes and goes on its own.</text>

  <!-- ══ footer rule ══ -->
  <rect x="40" y="482" width="920" height="52" rx="6" fill="#1c1d21" stroke="#35363a"/>
  <g class="ico" stroke="#5B9CF6" transform="translate(62,500)">
