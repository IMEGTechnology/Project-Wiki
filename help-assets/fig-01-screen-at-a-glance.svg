<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 0 1215 580" width="1215" height="580" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .lbl { fill:#8A8A8F; font-size:12px; }
      .cal { fill:#5B9CF6; font-size:12px; font-weight:600; }
