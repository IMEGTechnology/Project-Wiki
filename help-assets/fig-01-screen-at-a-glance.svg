  <path d="M648,150 L648,124 Q648,120 644,120 L636,120 Q632,120 632,124 L632,138 C632,148 642,148 644,156 Z" fill="#2f3036" stroke="#4a4b50" stroke-width="0.8"/>
  <rect x="641" y="125" width="2.4" height="7" fill="#A0A0A5"/>
  <rect x="636.6" y="125" width="7.2" height="7" rx="1" fill="none" stroke="#A0A0A5" stroke-width="0.9"/>

