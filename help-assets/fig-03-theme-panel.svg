<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .t   { fill:#C9C9CE; font-size:12px; }
      .lb  { fill:#8A8A8F; font-size:10.5px; font-weight:700; letter-spacing:.4px; }
      .sec { fill:#C9C9CE; font-size:12px; font-weight:600; }
      .dim { fill:#6E6E73; font-size:10.5px; }
      .acc { fill:#5B9CF6; font-size:11.5px; font-weight:600; }
      .lead{ stroke:#5B9CF6; stroke-width:1; fill:none; }
      .ico { stroke:#A0A0A5; stroke-width:1.3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>
  <rect width="1000" height="520" fill="#17181c"/>

  <!-- app behind -->
  <rect x="40" y="60" width="620" height="420" rx="8" fill="#24252b" stroke="#35363a"/>
  <rect x="40" y="60" width="620" height="34" rx="8" fill="#27282c"/>
  <rect x="40" y="84" width="620" height="10" fill="#27282c"/>
  <line x1="40" y1="94" x2="660" y2="94" stroke="#35363a"/>
  <rect x="40" y="94" width="150" height="386" fill="#1e1f24"/>
  <text x="54" y="116" class="lb">VAULT FILES</text>
  <rect x="54" y="132" width="10" height="9" rx="2" fill="#FF8080" opacity=".8"/><rect x="72" y="133" width="66" height="7" rx="3" fill="#3a3b40"/>
  <rect x="54" y="154" width="10" height="9" rx="2" fill="#F5C26B" opacity=".8"/><rect x="72" y="155" width="54" height="7" rx="3" fill="#3a3b40"/>
  <rect x="54" y="176" width="10" height="9" rx="2" fill="#5FD98A" opacity=".8"/><rect x="72" y="177" width="72" height="7" rx="3" fill="#3a3b40"/>
  <text x="220" y="150" fill="#5B9CF6" font-size="20" font-weight="700">Site A — Scope</text>
  <rect x="220" y="166" width="230" height="1.5" fill="#5B9CF6" opacity=".25"/>
  <rect x="220" y="190" width="300" height="7" rx="3" fill="#3a3b40"/>
  <rect x="220" y="210" width="270" height="7" rx="3" fill="#3a3b40"/>
  <rect x="220" y="230" width="290" height="7" rx="3" fill="#3a3b40"/>
  <text x="220" y="272" fill="#FF8080" font-size="15" font-weight="700">Deliverables</text>
  <rect x="220" y="290" width="200" height="7" rx="3" fill="#3a3b40"/>
  <rect x="220" y="310" width="230" height="7" rx="3" fill="#3a3b40"/>

  <!-- badge in header -->
  <circle cx="632" cy="77" r="9" fill="#5B9CF6" opacity=".18" stroke="#5B9CF6"/>
  <text x="632" y="81" text-anchor="middle" fill="#5B9CF6" font-size="9" font-weight="700">JS</text>

  <!-- theme panel popup -->
  <rect x="430" y="104" width="300" height="360" rx="8" fill="#1e1f24" stroke="#4a4b50"/>
  <rect x="430" y="104" width="300" height="34" rx="8" fill="#24252b"/>
  <rect x="430" y="128" width="300" height="10" fill="#24252b"/>
  <line x1="430" y1="138" x2="730" y2="138" stroke="#35363a"/>
  <text x="446" y="126" class="sec">Theme</text>
  <g class="ico" transform="translate(706,113)"><line x1="8" y1="0" x2="0" y2="8"/><line x1="0" y1="0" x2="8" y2="8"/></g>

  <!-- open section: Appearance -->
  <rect x="430" y="138" width="300" height="26" fill="#24252b"/>
  <text x="446" y="155" class="sec">Appearance</text>
  <g class="ico" transform="translate(700,148)"><polyline points="0,4 4,0 8,4"/></g>
  <text x="678" y="155" class="dim">Reset</text>

  <text x="446" y="180" class="lb">MODE</text>
  <rect x="446" y="188" width="268" height="24" rx="5" fill="#17181c" stroke="#35363a"/>
  <rect x="448" y="190" width="88" height="20" rx="4" fill="#5B9CF6" opacity=".22"/>
  <text x="492" y="204" text-anchor="middle" fill="#5B9CF6" font-size="11" font-weight="600">Dark</text>
  <text x="580" y="204" text-anchor="middle" class="t" font-size="11">Light</text>
  <text x="668" y="204" text-anchor="middle" class="t" font-size="11">System</text>

  <text x="446" y="234" class="lb">PRESET</text>
  <g>
    <rect x="446" y="242" width="84" height="30" rx="5" fill="#24252b" stroke="#35363a"/>
    <rect x="454" y="250" width="14" height="14" rx="3" fill="#1c1c1a" stroke="#3a3a38"/><rect x="458" y="254" width="6" height="6" rx="1" fill="#64B5F6"/>
    <text x="476" y="261" class="t" font-size="10.5">Default</text>

    <rect x="538" y="242" width="84" height="30" rx="5" fill="#24252b" stroke="#35363a"/>
    <rect x="546" y="250" width="14" height="14" rx="3" fill="#101418" stroke="#2a3038"/><rect x="550" y="254" width="6" height="6" rx="1" fill="#4FC3F7"/>
    <text x="568" y="261" class="t" font-size="10.5">Ocean</text>

    <rect x="630" y="242" width="84" height="30" rx="5" fill="#24252b" stroke="#35363a"/>
    <rect x="638" y="250" width="14" height="14" rx="3" fill="#151a1f" stroke="#2b3238"/><rect x="642" y="254" width="6" height="6" rx="1" fill="#8FD3F4"/>
    <text x="660" y="261" class="t" font-size="10.5">Frost</text>

    <rect x="446" y="278" width="84" height="30" rx="5" fill="#24252b" stroke="#35363a"/>
    <rect x="454" y="286" width="14" height="14" rx="3" fill="#1d1a18" stroke="#332e2a"/><rect x="458" y="290" width="6" height="6" rx="1" fill="#E0A272"/>
    <text x="476" y="297" class="t" font-size="10.5">Clay</text>

    <rect x="538" y="278" width="84" height="30" rx="5" fill="#5B9CF6" fill-opacity=".12" stroke="#5B9CF6"/>
    <rect x="546" y="286" width="14" height="14" rx="3" fill="#24252b" stroke="#35363a"/><rect x="550" y="290" width="6" height="6" rx="1" fill="#5B9CF6"/>
    <text x="568" y="297" fill="#5B9CF6" font-size="10.5" font-weight="600">Things</text>

    <rect x="630" y="278" width="84" height="30" rx="5" fill="#24252b" stroke="#35363a"/>
    <rect x="638" y="286" width="14" height="14" rx="3" fill="#1e1e1e" stroke="#3b3b3b"/><rect x="642" y="290" width="6" height="6" rx="1" fill="#d04255"/>
    <text x="660" y="297" class="t" font-size="10.5">Minimal</text>
  </g>

  <text x="446" y="332" class="lb">ACCENT</text>
  <g>
    <circle cx="454" cy="348" r="9" fill="#5B9CF6" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="482" cy="348" r="9" fill="#5FD98A"/>
    <circle cx="510" cy="348" r="9" fill="#D0BCFF"/>
    <circle cx="538" cy="348" r="9" fill="#EF9F27"/>
    <circle cx="566" cy="348" r="9" fill="#F0997B"/>
    <circle cx="594" cy="348" r="9" fill="#F2555A"/>
    <circle cx="622" cy="348" r="9" fill="#98989D"/>
  </g>

  <!-- collapsed sections -->
  <g>
    <line x1="430" y1="368" x2="730" y2="368" stroke="#35363a"/>
    <text x="446" y="386" class="sec">Reading</text>
    <g class="ico" transform="translate(700,381)"><polyline points="0,0 4,4 8,0"/></g>
    <line x1="430" y1="396" x2="730" y2="396" stroke="#35363a"/>
    <text x="446" y="414" class="sec">Headings</text>
    <g class="ico" transform="translate(700,409)"><polyline points="0,0 4,4 8,0"/></g>
    <line x1="430" y1="424" x2="730" y2="424" stroke="#35363a"/>
    <text x="446" y="442" class="sec">Navigation icons</text>
    <g class="ico" transform="translate(700,437)"><polyline points="0,0 4,4 8,0"/></g>
    <line x1="430" y1="452" x2="730" y2="452" stroke="#35363a"/>
  </g>
  <text x="446" y="470" class="dim">Saves as you change it</text>
  <text x="714" y="470" class="dim" text-anchor="end">Reset all</text>

  <!-- callouts -->
  <g class="lead">
    <path d="M641 68 L780 68"/>
    <path d="M736 200 L800 200"/>
    <path d="M736 300 L800 300"/>
    <path d="M420 340 L386 340 L386 372 L360 372"/>
    <path d="M736 430 L800 430"/>
  </g>
  <text x="786" y="64" class="acc">Opens from your initials</text>
  <text x="786" y="80" class="dim" font-size="10.5">badge → Theme</text>

  <text x="806" y="188" class="acc">Mode is separate</text>
  <text x="806" y="204" class="dim" font-size="10.5">Dark, Light or System.</text>
  <text x="806" y="219" class="dim" font-size="10.5">Never shared with others.</text>

  <text x="806" y="288" class="acc">One preset sets it all</text>
  <text x="806" y="304" class="dim" font-size="10.5">Backgrounds, all six heading</text>
  <text x="806" y="319" class="dim" font-size="10.5">colours and the accent, with</text>
  <text x="806" y="334" class="dim" font-size="10.5">its own dark and light values.</text>

  <text x="354" y="378" class="acc" text-anchor="end">Popup, not a modal</text>
  <text x="354" y="394" class="dim" font-size="10.5" text-anchor="end">The note stays visible and</text>
  <text x="354" y="409" class="dim" font-size="10.5" text-anchor="end">every change lands live.</text>

  <text x="806" y="424" class="acc">No Save button</text>
  <text x="806" y="440" class="dim" font-size="10.5">Everything writes as you</text>
  <text x="806" y="455" class="dim" font-size="10.5">change it. Reset per section,</text>
  <text x="806" y="470" class="dim" font-size="10.5">or Reset all in the footer.</text>
</svg>
